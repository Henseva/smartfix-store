"border-t border<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HortiArtesanal - Aplicação Web/Mobile</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-100 text-stone-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const PRODUCTS = [
      {
        id: 1,
        name: 'Morangos Silvestres Orgânicos',
        category: 'Frutas',
        price: 14.90,
        unit: 'caixa 250g',
        rating: 4.9,
        badge: 'Colheita Hoje',
        image: 'https://images.unsplash.com/photo-1464965911861-746a04b4bca6?auto=format&fit=crop&q=80&w=600',
        organic: true,
        producer: 'Sítio Verde Vida - Atibaia/SP'
      },
      {
        id: 2,
        name: 'Abacate Manteiga Selecionado',
        category: 'Frutas',
        price: 9.80,
        unit: 'kg',
        rating: 4.8,
        badge: 'Em Alta',
        image: 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?auto=format&fit=crop&q=80&w=600',
        organic: false,
        producer: 'Fazenda Manteiqueira - Holambra/SP'
      },
      {
        id: 3,
        name: 'Cesta da Estação (Pequena)',
        category: 'Cestas',
        price: 69.90,
        unit: 'unidade (8 itens)',
        rating: 5.0,
        badge: 'Mais Vendido',
        image: 'https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&q=80&w=600',
        organic: true,
        producer: 'Cooperativa Orgânica Local'
      },
      {
        id: 4,
        name: 'Couve Butter Hydroponic',
        category: 'Verduras',
        price: 5.50,
        unit: 'maço',
        rating: 4.7,
        badge: 'Hidropônico',
        image: 'https://images.unsplash.com/photo-1524179091875-bf98a9a6ae57?auto=format&fit=crop&q=80&w=600',
        organic: true,
        producer: 'Horta Hidropônica Água Pura'
      },
      {
        id: 5,
        name: 'Tomate Sweet Grape Orgânico',
        category: 'Legumes',
        price: 11.20,
        unit: 'bandeja 400g',
        rating: 4.9,
        badge: 'Sabor Doce',
        image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&q=80&w=600',
        organic: true,
        producer: 'Sítio Sol Nascente'
      },
      {
        id: 6,
        name: 'Cenoura Baby Crocante',
        category: 'Legumes',
        price: 7.40,
        unit: 'pacote 300g',
        rating: 4.8,
        badge: 'Pronto p/ Consumo',
        image: 'https://images.unsplash.com/photo-1598170845058-12ef4a457939?auto=format&fit=crop&q=80&w=600',
        organic: false,
        producer: 'Fazenda Terra Rica'
      }
    ];

    const RECIPES = [
      {
        id: 101,
        title: 'Salada Crocante com Tomate Sweet Grape & Couve',
        time: '15 min',
        difficulty: 'Fácil',
        ingredients: ['Tomate Sweet Grape Orgânico', 'Couve Butter Hydroponic'],
        image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&q=80&w=600'
      },
      {
        id: 102,
        title: 'Guacamole Fresco Artesanal',
        time: '10 min',
        difficulty: 'Fácil',
        ingredients: ['Abacate Manteiga Selecionado', 'Tomate Sweet Grape Orgânico'],
        image: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&q=80&w=600'
      }
    ];

    const CATEGORIES = ['Todos', 'Frutas', 'Verduras', 'Legumes', 'Orgânicos', 'Cestas'];

    function App() {
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState({});
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('loja');
      const [deliveryDate, setDeliveryDate] = useState('Hoje (16h - 18h)');
      const [paymentMethod, setPaymentMethod] = useState('pix');

      const handleQuantityChange = (id, delta) => {
        setCart((prev) => {
          const current = prev[id] || 0;
          const next = current + delta;
          if (next <= 0) {
            const copy = { ...prev };
            delete copy[id];
            return copy;
          }
          return { ...prev, [id]: next };
        });
      };

      const addRecipeIngredientsToCart = (ingredients) => {
        ingredients.forEach((ing) => {
          const product = PRODUCTS.find((p) => p.name.toLowerCase().includes(ing.toLowerCase()) || ing.toLowerCase().includes(p.name.toLowerCase()));
          if (product) {
            handleQuantityChange(product.id, 1);
          }
        });
        setIsCartOpen(true);
      };

      const filteredProducts = PRODUCTS.filter((item) => {
        const matchesCategory =
          selectedCategory === 'Todos' ||
          (selectedCategory === 'Orgânicos' ? item.organic : item.category === selectedCategory);
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const totalItemsCount = Object.values(cart).reduce((a, b) => a + b, 0);
      const totalPrice = Object.entries(cart).reduce((sum, [id, qty]) => {
        const prod = PRODUCTS.find((p) => p.id === Number(id));
        return sum + (prod ? prod.price * qty : 0);
      }, 0);

      const generateWhatsAppMessage = () => {
        let msg = `*Novo Pedido - HortiArtesanal*\n\n`;
        Object.entries(cart).forEach(([id, qty]) => {
          const p = PRODUCTS.find((item) => item.id === Number(id));
          if (p) msg += `• ${qty}x ${p.name} (R$ ${(p.price * qty).toFixed(2)})\n`;
        });
        const freight = totalPrice >= 120 ? 0 : 12;
        msg += `\n*Entrega:* ${deliveryDate}`;
        msg += `\n*Pagamento:* ${paymentMethod.toUpperCase()}`;
        msg += `\n*Total com Frete:* R$ ${(totalPrice + freight).toFixed(2)}`;
        return encodeURIComponent(msg);
      };

      return (
        <div className="min-h-screen pb-12">
          {/* Top Banner */}
          <div className="bg-emerald-950 text-emerald-100 text-xs font-bold text-center py-2 px-4">
            🌿 Frete grátis acima de R$ 120,00 | Entregas expressas no mesmo dia em São Paulo
          </div>

          {/* Header */}
          <header className="bg-white border-b border-stone-200 sticky top-0 z-40 px-4">
            <div className="max-w-6xl mx-auto h-16 flex items-center justify-between gap-4">
              <div onClick={() => setActiveTab('loja')} className="cursor-pointer flex items-center gap-2">
                <div className="w-9 h-9 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">🍃</div>
                <div>
                  <span className="text-lg font-bold text-emerald-950 block leading-none">Horti<span className="text-emerald-600">Artesanal</span></span>
                  <span className="text-[9px] uppercase tracking-wider text-stone-500 font-medium">Frescor & Origem</span>
                </div>
              </div>

              <nav className="flex gap-4 text-xs font-bold">
                <button onClick={() => setActiveTab('loja')} className={`pb-1 ${activeTab === 'loja' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-stone-600'}`}>Catálogo</button>
                <button onClick={() => setActiveTab('assinatura')} className={`pb-1 ${activeTab === 'assinatura' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-stone-600'}`}>Clube Assinatura</button>
                <button onClick={() => setActiveTab('receitas')} className={`pb-1 ${activeTab === 'receitas' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-stone-600'}`}>Receitas</button>
              </nav>

              <button onClick={() => setIsCartOpen(true)} className="bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs relative hover:bg-emerald-800 transition">
                🛒 R$ {totalPrice.toFixed(2)}
                {totalItemsCount > 0 && (
                  <span className="absolute -top-1.5 -right-1.5 bg-amber-500 text-stone-900 text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">
                    {totalItemsCount}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-6xl mx-auto px-4 pt-6">
            {/* View 1: Catalogue */}
            {activeTab === 'loja' && (
              <div>
                <div className="bg-emerald-900 text-white p-8 rounded-3xl mb-6">
                  <span className="bg-emerald-700 text-emerald-100 text-xs font-bold px-3 py-1 rounded-full">100% Orgânico e Selecionado</span>
                  <h1 className="text-2xl sm:text-3xl font-bold mt-3 mb-2">O melhor da terra, direto na sua mesa.</h1>
                  <p className="text-emerald-200 text-sm max-w-md">Alimentos colhidos no ponto ideal com entrega climatizada no mesmo dia.</p>
                </div>

                {/* Filters */}
                <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
                  <div className="flex gap-2 overflow-x-auto pb-1">
                    {CATEGORIES.map((cat) => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${selectedCategory === cat ? 'bg-emerald-900 text-white' : 'bg-white text-stone-700 border border-stone-200 hover:bg-stone-50'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  <input
                    type="text"
                    placeholder="Busque por frutas, legumes..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="px-3 py-2 rounded-xl border border-stone-200 text-xs w-56 focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white"
                  />
                </div>

                {/* Products Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {filteredProducts.map((product) => {
                    const qty = cart[product.id] || 0;
                    return (
                      <div key={product.id} className="bg-white rounded-2xl border border-stone-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <div>
                          <div className="h-44 relative overflow-hidden">
                            <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                            <span className="absolute top-2 left-2 bg-emerald-950/80 text-white text-[10px] font-bold px-2 py-1 rounded-md backdrop-blur-sm">
                              {product.badge}
                            </span>
                          </div>
                          <div className="p-4">
                            <div className="text-xs text-amber-500 font-bold mb-1">⭐ {product.rating}</div>
                            <h3 className="text-base font-bold text-stone-900 mb-0.5">{product.name}</h3>
                            <p className="text-xs text-emerald-700 font-semibold mb-2">📍 {product.producer}</p>
                            <p className="text-xs text-stone-500">R$ {product.price.toFixed(2)} / {product.unit}</p>
                          </div>
                        </div>

                        <div className="p-4 border-t border-stone-100 flex items-center justify-between">
                          <span className="text-lg font-extrabold text-stone-900">R$ {product.price.toFixed(2)}</span>
                          {qty === 0 ? (
                            <button onClick={() => handleQuantityChange(product.id, 1)} className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-100 transition">
                              + Adicionar
                            </button>
                          ) : (
                            <div className="flex items-center gap-2 bg-stone-100 px-2 py-1 rounded-lg">
                              <button onClick={() => handleQuantityChange(product.id, -1)} className="font-bold text-stone-600 px-1">-</button>
                              <span className="text-xs font-bold">{qty}</span>
                              <button onClick={() => handleQuantityChange(product.id, 1)} className="font-bold text-stone-600 px-1">+</button>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* View 2: Subscriptions */}
            {activeTab === 'assinatura' && (
              <div className="py-4">
                <div className="text-center mb-8">
                  <h2 className="text-2xl font-bold text-stone-900">Clube de Assinatura Frescor Recorrente</h2>
                  <p className="text-stone-500 text-xs mt-1">Receba cestas selecionadas na sua frequência sem precisar refazer pedidos.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                  <div className="bg-white rounded-2xl border border-stone-200 p-6 flex flex-col justify-between">
                    <div>
                      <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">Semanal</span>
                      <h3 className="text-xl font-bold mt-3">Cesta Essencial Família</h3>
                      <p className="text-xs text-stone-500 mt-1">10 a 12 itens selecionados da época por semana.</p>
                      <h4 className="text-3xl font-extrabold text-stone-900 my-4">R$ 79,90 <span className="text-xs font-normal text-stone-400">/ semana</span></h4>
                    </div>
                    <button onClick={() => setIsCartOpen(true)} className="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs hover:bg-emerald-800 transition">Assinar Cesta Semanal</button>
                  </div>

                  <div className="bg-emerald-950 text-white rounded-2xl p-6 flex flex-col justify-between">
                    <div>
                      <span className="bg-amber-500 text-stone-900 text-xs font-bold px-3 py-1 rounded-full">Mais Popular</span>
                      <h3 className="text-xl font-bold mt-3">Cesta Orgânica Premium</h3>
                      <p className="text-xs text-emerald-200 mt-1">14 itens 100% orgânicos certificados quinzenais.</p>
                      <h4 className="text-3xl font-extrabold text-white my-4">R$ 139,90 <span className="text-xs font-normal text-emerald-300">/ quinzena</span></h4>
                    </div>
                    <button onClick={() => setIsCartOpen(true)} className="w-full bg-amber-500 text-stone-950 py-3 rounded-xl font-bold text-xs hover:bg-amber-400 transition">Assinar Cesta Premium</button>
                  </div>
                </div>
              </div>
            )}

            {/* View 3: Recipes */}
            {activeTab === 'receitas' && (
              <div className="py-4">
                <div className="text-center mb-8">
                  <h2 className="text-2xl font-bold text-stone-900">Receitas do Nosso Chef</h2>
                  <p className="text-stone-500 text-xs mt-1">Adicione todos os ingredientes diretamente ao carrinho com um clique.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                  {RECIPES.map((recipe) => (
                    <div key={recipe.id} className="bg-white rounded-2xl border border-stone-200 overflow-hidden flex flex-col justify-between">
                      <img src={recipe.image} alt={recipe.title} className="w-full h-40 object-cover" />
                      <div className="p-5 flex-1 flex flex-col justify-between">
                        <div>
                          <span className="text-xs text-emerald-700 font-bold">⏱️ {recipe.time} • {recipe.difficulty}</span>
                          <h3 className="text-lg font-bold mt-1 mb-2">{recipe.title}</h3>
                          <ul className="list-disc pl-4 text-xs text-stone-600 space-y-1">
                            {recipe.ingredients.map((ing, idx) => <li key={idx}>{ing}</li>)}
                          </ul>
                        </div>
                        <button onClick={() => addRecipeIngredientsToCart(recipe.ingredients)} className="mt-4 w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2.5 rounded-xl font-bold text-xs hover:bg-emerald-100 transition">
                          + Adicionar Ingredientes ao Carrinho
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Cart Drawer Modal */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex justify-end">
              <div className="w-full max-w-md bg-white h-full p-6 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center border-b border-stone-200 pb-3">
                    <h2 className="text-lg font-bold">Seu Carrinho</h2>
                    <button onClick={() => setIsCartOpen(false)} className="text-stone-500 font-bold hover:text-stone-800">✕</button>
                  </div>

                  <div className="mt-4 max-h-[60vh] overflow-y-auto space-y-3">
                    {Object.keys(cart).length === 0 ? (
                      <p className="text-center text-stone-400 py-10 text-sm">Seu carrinho está vazio.</p>
                    ) : (
                      Object.entries(cart).map(([id, qty]) => {
                        const product = PRODUCTS.find((p) => p.id === Number(id));
                        if (!product) return null;
                        return (
                          <div key={id} className="flex items-center justify-between border-b border-stone-100 pb-2">
                            <div>
                              <div className="text-xs font-bold text-stone-800">{product.name}</div>
                              <div className="text-[11px] text-stone-500">R$ {product.price.toFixed(2)} x {qty}</div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => handleQuantityChange(product.id, -1)} className="bg-stone-100 px-2 py-0.5 rounded text-xs font-bold">-</button>
                              <span className="text-xs font-bold">{qty}</span>
                              <button onClick={() => handleQuantityChange(product.id, 1)} className="bg-stone-100 px-2 py-0.5 rounded text-xs font-bold">+</button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {totalItemsCount > 0 && (
                  <div className="border-t border-stone-200 pt-4">
                    <div className="flex justify-between font-bold text-base mb-3">
                      <span>Total:</span>
                      <span>R$ {(totalPrice + (totalPrice >= 120 ? 0 : 12)).toFixed(2)}</span>
                    </div>
                    <button onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }} className="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs hover:bg-emerald-800 transition">
                      Avançar para Agendamento
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Checkout Modal */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 bg-black/60 z-60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 relative">
                <button onClick={() => setIsCheckoutOpen(false)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700 font-bold">✕</button>
                
                <h3 className="text-lg font-bold mb-1">Agendamento e Pagamento</h3>
                <p className="text-xs text-stone-500 mb-4">Escolha o melhor horário de entrega.</p>

                <div className="mb-4">
                  <label className="text-xs font-bold block mb-1">Horário da Entrega:</label>
                  <select value={deliveryDate} onChange={(e) => setDeliveryDate(e.target.value)} className="w-full p-2.5 rounded-xl border border-stone-200 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                    <option>Hoje (16h - 18h)</option>
                    <option>Amanhã (08h - 10h)</option>
                    <option>Amanhã (14h - 16h)</option>
                  </select>
                </div>

                <div className="mb-5">
                  <label className="text-xs font-bold block mb-1">Pagamento:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {['pix', 'cartao', 'dinheiro'].map((pm) => (
                      <button key={pm} onClick={() => setPaymentMethod(pm)} className={`p-2 border rounded-xl text-xs font-bold uppercase transition ${paymentMethod === pm ? 'bg-emerald-50 border-emerald-600 text-emerald-800' : 'bg-white border-stone-200 text-stone-700'}`}>
                        {pm}
                      </button>
                    ))}
                  </div>
                </div>

                <a href={`https://wa.me/?text=${generateWhatsAppMessage()}`} target="_blank" rel="noopener noreferrer" className="block text-center bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs hover:bg-emerald-800 transition">
                  Confirmar Pedido via WhatsApp
                </a>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
