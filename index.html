<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Bottom Nav</title>
<style>
:root{
  --orange:#ff9f1a;
  --orange-dark:#f08c00;
  --font-head:'Segoe UI',system-ui,-apple-system,sans-serif;
  --shadow-md:0 6px 20px rgba(0,0,0,.14);
  --shadow-lg:0 0 40px rgba(0,0,0,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9ec;font-family:var(--font-head);display:flex;justify-content:center}

.app{width:100%;max-width:520px;min-height:100vh;background:#fff;box-shadow:var(--shadow-lg);padding-bottom:108px;position:relative}

/* ---- conteúdo demo (só p/ visualização) ---- */
.hero{padding:26px 20px 16px;background:linear-gradient(160deg,#eafbee,#dff5e4);border-radius:0 0 28px 28px}
.hero h1{font-size:22px;font-weight:800;color:#1d3b27}
.hero p{font-size:13px;color:#5c7a66;margin-top:4px}
.section{padding:20px}
.section h2{font-size:16px;font-weight:700;color:#222;margin-bottom:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fafafa;border-radius:16px;padding:14px;font-size:13px;font-weight:600;color:#333}
.card .emoji{font-size:28px;display:block;margin-bottom:8px}
.card .price{color:var(--orange-dark);font-weight:800;margin-top:6px;font-size:14px}
.page{display:none}
.page.show{display:block}
.placeholder{padding:60px 24px;text-align:center;color:#999;font-size:14px}
.placeholder .big{font-size:44px;display:block;margin-bottom:10px}

/* bottom nav + cart */
.navwrap{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:max(16px, env(safe-area-inset-bottom));
  width:calc(100% - 28px);
  max-width:496px;
  z-index:30;
}
.bottom{
  display:flex;
  align-items:center;
  height:64px;
  background:#fff;
  border-radius:999px;
  box-shadow:0 10px 36px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.06);
  padding:6px 8px 6px 6px;
  gap:2px;
}
.navlogo{
  width:52px;
  height:52px;
  border-radius:50%;
  flex:none;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#eafbee 55%,#dff5e4 100%);
  border:2.5px solid var(--orange);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 3px 10px rgba(255,159,26,.28);
  margin-right:2px;
}
.nav{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:7px 2px;
  color:#9a9a9a;
  font-size:9.5px;
  font-weight:500;
  cursor:pointer;
  border-radius:20px;
  transition:background .22s ease, color .22s ease, box-shadow .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
}
.nav svg{width:20px;height:20px;display:block;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.nav .dot{display:block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;transition:opacity .2s}
.nav.active{
  background:var(--orange);
  color:#fff;
  font-weight:700;
  box-shadow:0 6px 16px rgba(255,159,26,.38);
}
.nav.active svg{transform:scale(1.08)}
.nav.active .dot{opacity:1;background:#fff}

.cart{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:92px;
  background:var(--orange-dark);
  color:#fff;
  border:0;
  border-radius:24px;
  padding:11px 20px;
  font-weight:700;
  font-size:12.5px;
  box-shadow:var(--shadow-md);
  z-index:25;
  cursor:pointer;
  font-family:var(--font-head);
}
.cart span{background:#fff;color:var(--orange-dark);border-radius:10px;padding:1px 7px;margin-left:5px}
</style>
</head>
<body>
<div class="app">

  <div class="page show" data-page="inicio">
    <div class="hero">
      <h1>Olá, Ana 🍃</h1>
      <p>O que vamos comer de saudável hoje?</p>
    </div>
    <div class="section">
      <h2>Populares</h2>
      <div class="cards">
        <div class="card"><span class="emoji">🥗</span>Salada Caesar<div class="price">R$ 24,90</div></div>
        <div class="card"><span class="emoji">🥑</span>Bowl de Abacate<div class="price">R$ 27,50</div></div>
        <div class="card"><span class="emoji">🥤</span>Suco Verde<div class="price">R$ 12,00</div></div>
        <div class="card"><span class="emoji">🌯</span>Wrap Integral<div class="price">R$ 19,90</div></div>
      </div>
    </div>
  </div>

  <div class="page" data-page="cardapio"><div class="placeholder"><span class="big">🍽️</span>Cardápio completo</div></div>
  <div class="page" data-page="favoritos"><div class="placeholder"><span class="big">❤️</span>Seus favoritos</div></div>
  <div class="page" data-page="pedidos"><div class="placeholder"><span class="big">🧾</span>Histórico de pedidos</div></div>
  <div class="page" data-page="conta"><div class="placeholder"><span class="big">👤</span>Minha conta</div></div>

  <button class="cart">Ver sacola<span>3</span></button>

  <div class="navwrap">
  <nav class="bottom">
  <div class="navlogo">🍃</div>
  <div class="nav active" data-nav="inicio" onclick="goNav('inicio')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
    Início<span class="dot"></span>
  </div>
  <div class="nav" data-nav="cardapio" onclick="goNav('cardapio')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    Cardápio<span class="dot"></span>
  </div>
  <div class="nav" data-nav="favoritos" onclick="goNav('favoritos')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.6-4.6-10-9.4C.4 7.6 2.3 4 6 4c2.1 0 3.6 1.2 6 3.5C14.4 5.2 15.9 4 18 4c3.7 0 5.6 3.6 4 7.1-2.4 4.8-10 9.4-10 9.4Z"/></svg>
    Favoritos<span class="dot"></span>
  </div>
  <div class="nav" data-nav="pedidos" onclick="goNav('pedidos')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3.5 3.5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>
    Pedidos<span class="dot"></span>
  </div>
  <div class="nav" data-nav="conta" onclick="goNav('conta')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
    Conta<span class="dot"></span>
  </div>
  </nav>
  </div>

</div>

<script>
function goNav(id){
  document.querySelectorAll('.nav').forEach(n =>
    n.classList.toggle('active', n.dataset.nav === id)
  );
  document.querySelectorAll('.page').forEach(p =>
    p.classList.toggle('show', p.dataset.page === id)
  );
}
</script>
</body>
</html>
