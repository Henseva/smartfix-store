<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mercado Fresco - Hortifruti Delivery Premium" />
    <title>Mercado Fresco — Hortifruti Delivery</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #f6faf6;
            color: #1e293b;
        }

        input::placeholder {
            color: #64748b;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .transition-all {
            transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { Plus, Minus, Bell, ShoppingCart, Leaf, Search, Home, Utensils, Heart, ClipboardList, User } = lucide;

        // ============ DADOS DE PRODUTOS ============
        const vegetablesProducts = [
            {
                id: 1,
                title: 'Brócolis Picado Orgânico',
                weight: '300g',
                price: '12,90',
                image: 'https://images.unsplash.com/photo-1566781514411-b2db3cb63b83?w=500&h=500&fit=crop',
                badge: 'NOVIDADE!',
                badgeType: 'default',
            },
            {
                id: 2,
                title: 'Couve-Flor em Floretes',
                weight: '350g',
                price: '11,50',
                image: 'https://images.unsplash.com/photo-1587925591027-cfb56d88fcd2?w=500&h=500&fit=crop',
                badge: 'PROMOÇÃO!',
                badgeType: 'promo',
            },
            {
                id: 3,
                title: 'Abóbora Cabotiá em Cubos',
                weight: '400g',
                price: '9,80',
                image: 'https://images.unsplash.com/photo-1599599810694-0b25f0a6a0f5?w=500&h=500&fit=crop',
                badge: null,
                badgeType: null,
            },
            {
                id: 4,
                title: 'Mix Abobrinha & Cenoura',
                weight: '450g',
                price: '13,90',
                image: 'https://images.unsplash.com/photo-1470114716159-e389f8712fda?w=500&h=500&fit=crop',
                badge: 'NOVIDADE!',
                badgeType: 'default',
            },
            {
                id: 5,
                title: 'Tomate Cereja Cortado',
                weight: '250g',
                price: '15,20',
                image: 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=500&h=500&fit=crop',
                badge: null,
                badgeType: null,
            },
            {
                id: 6,
                title: 'Cenoura Ralada Fina',
                weight: '300g',
                price: '8,50',
                image: 'https://images.unsplash.com/photo-1599599810694-0b25f0a6a0f5?w=500&h=500&fit=crop',
                badge: 'PROMOÇÃO!',
                badgeType: 'promo',
            },
        ];

        const seasoningsProducts = [
            {
                id: 7,
                title: 'Páprica Defumada',
                weight: '100g',
                price: '16,90',
                image: 'https://images.unsplash.com/photo-1596040707152-286c69f85a96?w=500&h=500&fit=crop',
                badge: 'NOVIDADE!',
                badgeType: 'default',
            },
            {
                id: 8,
                title: 'Pimenta Calabresa em Flocos',
                weight: '80g',
                price: '14,50',
                image: 'https://images.unsplash.com/photo-1596040707152-286c69f85a96?w=500&h=500&fit=crop',
                badge: 'PROMOÇÃO!',
                badgeType: 'promo',
            },
            {
                id: 9,
                title: 'Pimenta do Reino em Grãos',
                weight: '90g',
                price: '19,80',
                image: 'https://images.unsplash.com/photo-1585518419759-eca31e5e57f6?w=500&h=500&fit=crop',
                badge: null,
                badgeType: null,
            },
            {
                id: 10,
                title: 'Sal Marinho Moído',
                weight: '150g',
                price: '11,20',
                image: 'https://images.unsplash.com/photo-1596040707152-286c69f85a96?w=500&h=500&fit=crop',
                badge: null,
                badgeType: null,
            },
            {
                id: 11,
                title: 'Chimichurri Argentino',
                weight: '100g',
                price: '17,50',
                image: 'https://images.unsplash.com/photo-1596040707152-286c69f85a96?w=500&h=500&fit=crop',
                badge: null,
                badgeType: null,
            },
            {
                id: 12,
                title: 'Orégano Seco Premium',
                weight: '50g',
                price: '13,90',
                image: 'https://images.unsplash.com/photo-1596040707152-286c69f85a96?w=500&h=500&fit=crop',
                badge: 'NOVIDADE!',
                badgeType: 'default',
            },
        ];

        const highlightedProducts = [
            vegetablesProducts[0],
            seasoningsProducts[0],
            vegetablesProducts[2],
            seasoningsProducts[4],
        ];

        // ============ COMPONENTE: ProductCard ============
        function ProductCard({ title, weight, price, image, badge, badgeType }) {
            const [quantity, setQuantity] = useState(0);

            const handleAdd = () => setQuantity(quantity + 1);
            const handleRemove = () => quantity > 0 && setQuantity(quantity - 1);

            return (
                <div className="bg-white border border-slate-100 rounded-2xl p-3 shadow-sm hover:shadow-md transition-shadow relative flex flex-col justify-between h-full">
                    {badge && (
                        <span className={`absolute top-3 left-3 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider text-white z-10 ${
                            badgeType === 'promo' ? 'bg-red-600' : 'bg-emerald-600'
                        }`}>
                            {badge}
                        </span>
                    )}

                    <div className="w-full h-32 rounded-xl overflow-hidden mb-3 bg-slate-50 flex items-center justify-center">
                        <img
                            src={image}
                            alt={title}
                            className="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
                        />
                    </div>

                    <div className="flex-1 flex flex-col justify-between">
                        <div>
                            <h4 className="font-semibold text-slate-800 text-xs sm:text-sm line-clamp-2 leading-tight">
                                {title}
                            </h4>
                            <p className="text-[11px] text-slate-400 mt-0.5">{weight}</p>
                        </div>

                        <div className="flex items-center justify-between mt-3 pt-2 border-t border-slate-50">
                            <span className="font-bold text-emerald-900 text-sm">R$ {price}</span>

                            {quantity === 0 ? (
                                <button
                                    onClick={handleAdd}
                                    className="w-8 h-8 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-sm active:scale-95 transition-all"
                                >
                                    <Plus size={16} strokeWidth={2.5} />
                                </button>
                            ) : (
                                <div className="flex items-center gap-1 bg-emerald-50 rounded-full px-1.5 py-0.5">
                                    <button
                                        onClick={handleRemove}
                                        className="w-6 h-6 rounded-full text-emerald-600 hover:bg-emerald-100 flex items-center justify-center transition-colors"
                                    >
                                        <Minus size={12} strokeWidth={3} />
                                    </button>
                                    <span className="text-xs font-semibold text-emerald-600 w-4 text-center">
                                        {quantity}
                                    </span>
                                    <button
                                        onClick={handleAdd}
                                        className="w-6 h-6 rounded-full text-emerald-600 hover:bg-emerald-100 flex items-center justify-center transition-colors"
                                    >
                                        <Plus size={12} strokeWidth={3} />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ COMPONENTE: Header ============
        function Header({ cartCount = 3 }) {
            return (
                <header className="bg-white border-b border-slate-100 px-4 py-3 shadow-sm sticky top-0 z-40">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center">
                                <Leaf size={20} className="text-white" />
                            </div>
                            <h1 className="text-lg font-bold text-slate-900">Mercado Fresco</h1>
                        </div>

                        <div className="flex items-center gap-3">
                            <button className="p-2 hover:bg-slate-100 rounded-lg transition-colors relative">
                                <Bell size={20} className="text-slate-600" />
                                <span className="absolute top-1 right-1 w-2 h-2 bg-red-600 rounded-full"></span>
                            </button>

                            <button className="p-2 hover:bg-slate-100 rounded-lg transition-colors relative">
                                <ShoppingCart size={20} className="text-slate-600" />
                                {cartCount > 0 && (
                                    <span className="absolute top-0 right-0 bg-red-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">
                                        {cartCount}
                                    </span>
                                )}
                            </button>
                        </div>
                    </div>
                </header>
            );
        }

        // ============ COMPONENTE: HeroBanner ============
        function HeroBanner() {
            return (
                <div className="px-4 py-6 max-w-7xl mx-auto">
                    <div className="relative bg-gradient-to-r from-emerald-600 to-emerald-500 rounded-2xl overflow-hidden shadow-md h-48 flex items-center">
                        <div className="relative z-10 px-6 text-white max-w-md">
                            <h2 className="text-3xl sm:text-4xl font-bold mb-2 leading-tight">
                                Hortifruti fresco todo dia
                            </h2>
                            <p className="text-sm sm:text-base opacity-90">
                                Frutas, legumes e temperos frescos direto para sua casa
                            </p>
                        </div>

                        <div className="absolute right-0 top-0 w-48 h-48 opacity-20">
                            <svg viewBox="0 0 200 200" className="w-full h-full">
                                <circle cx="100" cy="100" r="80" fill="white" opacity="0.3" />
                                <circle cx="100" cy="100" r="60" fill="white" opacity="0.2" />
                            </svg>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ COMPONENTE: QuickStatus ============
        function QuickStatus() {
            return (
                <div className="px-4 py-4 max-w-7xl mx-auto">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div className="bg-emerald-600 rounded-full px-3 py-2 text-white flex items-center gap-2 shadow-sm">
                            <span className="text-xs font-semibold leading-tight">
                                <div>Aberto</div>
                                <div className="opacity-90 text-[10px] font-normal">(08h-20h)</div>
                            </span>
                        </div>

                        <div className="bg-amber-600 rounded-full px-3 py-2 text-white flex items-center gap-2 shadow-sm">
                            <span className="text-xs font-semibold leading-tight">
                                <div>Entrega Grátis</div>
                                <div className="opacity-90 text-[10px] font-normal">(+R$80)</div>
                            </span>
                        </div>

                        <div className="bg-blue-600 rounded-full px-3 py-2 text-white flex items-center gap-2 shadow-sm">
                            <span className="text-xs font-semibold leading-tight">
                                <div>Mínimo</div>
                                <div className="opacity-90 text-[10px] font-normal">R$30</div>
                            </span>
                        </div>

                        <div className="bg-green-600 rounded-full px-3 py-2 text-white flex items-center gap-2 shadow-sm">
                            <span className="text-xs font-semibold leading-tight">
                                <div>WhatsApp</div>
                                <div className="opacity-90 text-[10px] font-normal">Suporte</div>
                            </span>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ COMPONENTE: SearchBar ============
        function SearchBar() {
            const [search, setSearch] = useState('');

            return (
                <div className="px-4 py-4 max-w-7xl mx-auto">
                    <div className="relative">
                        <Search className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400" size={20} />
                        <input
                            type="text"
                            placeholder="Buscar frutas, legumes, temperos..."
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            className="w-full pl-12 pr-4 py-3 rounded-full border border-slate-100 bg-white text-slate-800 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent shadow-sm text-sm"
                        />
                    </div>
                </div>
            );
        }

        // ============ COMPONENTE: CategorySelector ============
        function CategorySelector({ onSelectCategory }) {
            const [activeCategory, setActiveCategory] = useState('todos');

            const categories = [
                { id: 'todos', label: 'Todos' },
                { id: 'kit-frutas', label: 'Kit Fruta Semanal' },
                { id: 'saladas', label: 'Saladas Especiais' },
                { id: 'frutas-picadas', label: 'Frutas Picadas' },
                { id: 'legumes', label: 'Legumes e Verduras' },
                { id: 'temperos', label: 'Temperos' },
            ];

            const handleSelect = (id) => {
                setActiveCategory(id);
                onSelectCategory(id);
            };

            return (
                <div className="px-4 py-4 max-w-7xl mx-auto overflow-x-auto scrollbar-hide">
                    <div className="flex gap-2 pb-2">
                        {categories.map((cat) => (
                            <button
                                key={cat.id}
                                onClick={() => handleSelect(cat.id)}
                                className={`px-4 py-2 rounded-full whitespace-nowrap font-semibold text-sm transition-all shadow-sm ${
                                    activeCategory === cat.id
                                        ? 'bg-emerald-600 text-white'
                                        : 'bg-white text-slate-800 border border-slate-100'
                                }`}
                            >
                                {cat.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // ============ COMPONENTE: BottomNav ============
        function BottomNav({ activeTab = 'inicio', onSelectTab }) {
            const items = [
                { id: 'inicio', label: 'Início', icon: Home },
                { id: 'cardapio', label: 'Cardápio', icon: Utensils },
                { id: 'favoritos', label: 'Favoritos', icon: Heart },
                { id: 'pedidos', label: 'Pedidos', icon: ClipboardList },
                { id: 'conta', label: 'Conta', icon: User },
            ];

            return (
                <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-3 py-2 shadow-lg flex justify-around items-center z-50">
                    {items.map((item) => {
                        const Icon = item.icon;
                        const isActive = activeTab === item.id;

                        return (
                            <button
                                key={item.id}
                                onClick={() => onSelectTab(item.id)}
                                className={`flex flex-col items-center justify-center px-3 py-1.5 rounded-full transition-all ${
                                    isActive
                                        ? 'bg-emerald-600 text-white shadow-sm font-medium'
                                        : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <Icon size={20} strokeWidth={isActive ? 2.5 : 2} />
                                <span className="text-[10px] mt-0.5">{item.label}</span>
                            </button>
                        );
                    })}
                </nav>
            );
        }

        // ============ PÁGINA: Home ============
        function HomePage() {
            return (
                <div className="bg-slate-50 min-h-screen">
                    <Header cartCount={3} />
                    <HeroBanner />
                    <QuickStatus />
                    <SearchBar />
                    <CategorySelector onSelectCategory={(id) => console.log('Selected:', id)} />

                    <div className="px-4 py-6 max-w-7xl mx-auto pb-32">
                        <h2 className="text-xl font-bold text-slate-900 mb-4">
                            Destaques para você
                        </h2>
                        <div className="grid grid-cols-2 gap-3">
                            {highlightedProducts.map((product) => (
                                <ProductCard
                                    key={product.id}
                                    title={product.title}
                                    weight={product.weight}
                                    price={product.price}
                                    image={product.image}
                                    badge={product.badge}
                                    badgeType={product.badgeType}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ PÁGINA: VegetablesCategory ============
        function VegetablesCategoryPage() {
            return (
                <div className="bg-slate-50 min-h-screen">
                    <Header cartCount={3} />

                    <div className="px-4 py-4 max-w-7xl mx-auto">
                        <h1 className="text-2xl font-bold text-slate-900">
                            Legumes e Verduras Picados
                        </h1>
                        <p className="text-slate-500 text-sm mt-1">
                            Vegetais frescos, higienizados e prontos para o preparo
                        </p>
                    </div>

                    <div className="px-4 py-6 max-w-7xl mx-auto pb-32">
                        <div className="grid grid-cols-2 gap-3">
                            {vegetablesProducts.map((product) => (
                                <ProductCard
                                    key={product.id}
                                    title={product.title}
                                    weight={product.weight}
                                    price={product.price}
                                    image={product.image}
                                    badge={product.badge}
                                    badgeType={product.badgeType}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ PÁGINA: SeasonsCategory ============
        function SeasonsCategoryPage() {
            return (
                <div className="bg-slate-50 min-h-screen">
                    <Header cartCount={3} />

                    <div className="px-4 py-4 max-w-7xl mx-auto">
                        <h1 className="text-2xl font-bold text-slate-900">
                            Temperos & Condimentos
                        </h1>
                        <p className="text-slate-500 text-sm mt-1">
                            Especiarias selecionadas para temperar seus pratos
                        </p>
                    </div>

                    <div className="px-4 py-6 max-w-7xl mx-auto pb-32">
                        <div className="grid grid-cols-2 gap-3">
                            {seasoningsProducts.map((product) => (
                                <ProductCard
                                    key={product.id}
                                    title={product.title}
                                    weight={product.weight}
                                    price={product.price}
                                    image={product.image}
                                    badge={product.badge}
                                    badgeType={product.badgeType}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ COMPONENTE: App ============
        function App() {
            const [activeTab, setActiveTab] = useState('inicio');

            const renderPage = () => {
                switch (activeTab) {
                    case 'cardapio':
                        return <VegetablesCategoryPage />;
                    case 'seasonings':
                        return <SeasonsCategoryPage />;
                    case 'favoritos':
                    case 'pedidos':
                    case 'conta':
                        return <HomePage />;
                    case 'inicio':
                    default:
                        return <HomePage />;
                }
            };

            return (
                <div className="bg-slate-50 min-h-screen">
                    {renderPage()}
                    <BottomNav activeTab={activeTab} onSelectTab={setActiveTab} />
                </div>
            );
        }

        // ============ RENDER ============
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
